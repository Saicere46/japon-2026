<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182b3a">
<link rel="manifest" href="manifest.json">
<title>Japón 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f7f4ee;color:#182b3a;font:15px system-ui,sans-serif}.wrap{max-width:950px;margin:auto}.hero{padding:55px 20px 30px;color:#fff;background:linear-gradient(#0003,#102331e8),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:52px Georgia,serif}.bar{padding:14px 20px;background:#fff;display:flex;justify-content:space-between;position:sticky;top:0;z-index:2}.content{padding:20px}.card,.day,.login{background:#fff;border:1px solid #e6e1d8;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.day{padding:0;overflow:hidden}.head{padding:16px;background:#eef1ee;display:flex;justify-content:space-between;gap:8px}.head h2,.card h2{margin:4px 0;font:25px Georgia,serif}.head small{color:#bd5b55;font-weight:bold}.act{padding:15px 18px;border-top:1px solid #e6e1d8;display:flex;gap:15px}.time{color:#bd5b55;font-weight:bold;min-width:45px}.act h3{margin:0}.muted{color:#71808a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#182b3a;color:#fff;cursor:pointer;text-decoration:none}.alt{background:#eee9df;color:#182b3a}.red{background:#f2d9d5;color:#8d3933}.photo{width:100px;height:75px;object-fit:cover;border-radius:10px}input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;font:inherit}label{display:block;font-weight:bold;margin:10px 0 5px}.login{max-width:400px;margin:60px auto}.error{color:#9b352f;background:#f8e0dd;padding:10px;border-radius:8px;margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{background:#fff;padding:22px;border-radius:18px;width:min(700px,92%);max-height:92vh;overflow:auto}.sheet h2{font:26px Georgia,serif;margin-top:0}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{border:0;background:#eee9df;color:#182b3a;border-radius:999px;padding:9px 13px}.tabs button.active{background:#182b3a;color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<div id="activityModal" class="modal"><div class="sheet"><h2 id="activityModalTitle">Añadir actividad</h2><form id="activityForm"><input type="hidden" id="activityId"><input type="hidden" id="oldPhoto"><label>Fecha</label><input id="activityDate" type="date" required><label>Hora</label><input id="activityTime" type="time"><label>Nombre</label><input id="activityTitle" required><label>Descripción y notas</label><textarea id="activityDescription"></textarea><label>Enlace de Google Maps</label><input id="activityMap" type="url"><label>Fotografía desde el móvil</label><input id="activityFile" type="file" accept="image/*"><label>URL de fotografía opcional</label><input id="activityPhoto" type="url"><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelActivity">Cancelar</button><button class="btn">Guardar actividad</button></div></form></div></div>
<div id="flightModal" class="modal"><div class="sheet"><h2 id="flightModalTitle">Añadir vuelo</h2><form id="flightForm"><input type="hidden" id="flightId"><label>Tipo</label><select id="flightType"><option value="ida">Ida</option><option value="vuelta">Vuelta</option><option value="interna">Interna</option></select><label>Aerolínea</label><input id="flightAirline" required><label>Número de vuelo</label><input id="flightNumber"><label>Origen</label><input id="flightFrom"><label>Destino</label><input id="flightTo"><label>Fecha</label><input id="flightDate" type="date"><label>Salida</label><input id="flightDeparture" type="time"><label>Llegada</label><input id="flightArrival" type="time"><label>Terminal / escala / localizador</label><input id="flightDetails" placeholder="Terminal, escalas, localizador, enlace..."><label>Notas</label><textarea id="flightNotes"></textarea><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelFlight">Cancelar</button><button class="btn">Guardar vuelo</button></div></form></div></div>
<div id="hotelModal" class="modal"><div class="sheet"><h2 id="hotelModalTitle">Añadir alojamiento</h2><form id="hotelForm"><input type="hidden" id="hotelId"><label>Nombre del hotel / Airbnb</label><input id="hotelName" required><label>Ciudad</label><input id="hotelCity" required><label>Dirección</label><input id="hotelAddress"><label>Google Maps</label><input id="hotelMaps" type="url"><label>Fecha de entrada</label><input id="hotelCheckInDate" type="date"><label>Hora de entrada</label><input id="hotelCheckInTime" type="time"><label>Fecha de salida</label><input id="hotelCheckOutDate" type="date"><label>Hora de salida</label><input id="hotelCheckOutTime" type="time"><label>Notas</label><textarea id="hotelNotes"></textarea><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelHotel">Cancelar</button><button class="btn">Guardar alojamiento</button></div></form></div></div>
<script>
const projectUrl="https://kbxyknwnueipkxcxxojc.supabase.co";
const publishableKey="sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q";
const client=window.supabase.createClient(projectUrl,publishableKey);
const tripId="81d43e9a-8d00-4087-a512-b2bc02dd3a44";
const root=document.getElementById("root");
let currentUser=null,activities=[],tripInfo={},flights=[],hotels=[],channel=null;
function showLogin(){root.innerHTML='<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form id="loginForm"><label>Correo electrónico</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div id="loginError"></div><button class="btn" style="margin-top:15px;width:100%">Entrar</button></form></div>';document.getElementById("loginForm").onsubmit=login}
async function login(e){e.preventDefault();const error=document.getElementById("loginError");const r=await client.auth.signInWithPassword({email:loginEmail.value,password:loginPassword.value});if(r.error){error.innerHTML='<div class="error">'+r.error.message+'</div>';return}currentUser=r.data.user;await loadData()}
async function loadData(){const [a,i,f,h]=await Promise.all([client.from("activities").select("*").eq("trip_id",tripId).order("activity_date").order("time"),client.from("trip_info").select("*").eq("trip_id",tripId).single(),client.from("trip_flights").select("*").eq("trip_id",tripId).order("flight_date"),client.from("trip_hotels").select("*").eq("trip_id",tripId).order("check_in_date")]);activities=a.data||[];tripInfo=i.data||{};flights=f.data||[];hotels=h.data||[];for(const item of activities){item.photoUrl=item.photo_url||"";if(item.photo_url&&!item.photo_url.startsWith("http")){const s=await client.storage.from("japan-photos").createSignedUrl(item.photo_url,3600);item.photoUrl=s.data?.signedUrl||""}}render();startRealtime()}
function startRealtime(){if(channel)client.removeChannel(channel);channel=client.channel("japan-2026-live").on("postgres_changes",{event:"*",schema:"public",table:"activities",filter:"trip_id=eq."+tripId},loadData).on("postgres_changes",{event:"*",schema:"public",table:"trip_info",filter:"trip_id=eq."+tripId},loadData).on("postgres_changes",{event:"*",schema:"public",table:"trip_flights",filter:"trip_id=eq."+tripId},loadData).on("postgres_changes",{event:"*",schema:"public",table:"trip_hotels",filter:"trip_id=eq."+tripId},loadData).subscribe()}
function safe(v){return String(v||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayName(d){return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
function city(d){if(d<="2026-11-01")return d==="2026-10-30"||d==="2026-11-01"?"Kioto":"Osaka";if(d<="2026-11-03")return d==="2026-11-03"?"Shirakawa-go":"Takayama";return d<"2026-11-10"?"Tokio":"Regreso a España"}
function render(){const groups={};activities.forEach(x=>{(groups[x.activity_date]??=[]).push(x)});const days=Object.keys(groups).sort();let html='<header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Shanghái · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" id="logout">Salir</button><button class="btn" id="addTop">＋ Añadir actividad</button></div></div><main class="content wrap"><div class="grid"><div class="card"><h2>✈ Vuelos</h2><div id="flightList"></div><button class="btn alt" id="addFlight">＋ Editar vuelos</button></div><div class="card"><h2>⌂ Alojamientos</h2><div id="hotelList"></div><button class="btn alt" id="addHotel">＋ Editar alojamientos</button></div></div><h2 style="font:26px Georgia,serif">Itinerario</h2>';for(const d of days){html+='<section class="day"><div class="head"><div><small>'+dayName(d)+'</small><h2>'+city(d)+'</h2></div><button class="btn alt addDay" data-date="'+d+'">＋ Actividad</button></div>';for(const x of groups[d]){html+='<article class="act">'+(x.photoUrl?'<img class="photo" src="'+x.photoUrl+'">':'')+'<div class="time">'+safe(x.time||"—")+'</div><div style="flex:1"><h3>'+safe(x.title)+'</h3><p class="muted">'+safe(x.description)+'</p><div class="actions">'+(x.google_maps_url?'<a class="btn alt" target="_blank" href="'+x.google_maps_url+'">↗ Google Maps</a>':'')+'<button class="btn alt editActivity" data-id="'+x.id+'">Editar</button><button class="btn red deleteActivity" data-id="'+x.id+'">Eliminar</button></div></div></article>'}html+='</section>'}html+='</main>';root.innerHTML=html;renderFlightList();renderHotelList();document.getElementById("logout").onclick=logout;document.getElementById("addTop").onclick=()=>openActivity();document.getElementById("addFlight").onclick=()=>openFlight();document.getElementById("addHotel").onclick=()=>openHotel();document.querySelectorAll(".addDay").forEach(b=>b.onclick=()=>openActivity(b.dataset.date));document.querySelectorAll(".editActivity").forEach(b=>b.onclick=()=>openActivity(null,b.dataset.id));document.querySelectorAll(".deleteActivity").forEach(b=>b.onclick=()=>deleteActivity(b.dataset.id))}
function renderFlightList(){const el=document.getElementById("flightList");el.innerHTML=(flights.length?flights:[]).map(f=>`<div class="card" style="margin:10px 0;padding:12px"><strong>${safe(f.flight_type==='ida'?'Ida':f.flight_type==='vuelta'?'Vuelta':'Interno')} · ${safe(f.airline)} ${safe(f.flight_number)}</strong><div class="muted">${safe(f.origin)} → ${safe(f.destination)}</div><div class="muted">${safe(f.flight_date)} ${safe(f.departure_time||'')} ${safe(f.arrival_time?('→ '+f.arrival_time):'')}</div><div class="muted">${safe(f.details)}</div><div class="actions"><button class="btn alt editFlight" data-id="${f.id}">Editar</button><button class="btn red deleteFlight" data-id="${f.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Aún no hay vuelos.</p>';el.querySelectorAll('.editFlight').forEach(b=>b.onclick=()=>openFlight(b.dataset.id));el.querySelectorAll('.deleteFlight').forEach(b=>b.onclick=()=>deleteFlight(b.dataset.id))}
function renderHotelList(){const el=document.getElementById("hotelList");el.innerHTML=(hotels.length?hotels:[]).map(h=>`<div class="card" style="margin:10px 0;padding:12px"><strong>${safe(h.name)} · ${safe(h.city)}</strong><div class="muted">${safe(h.address)}</div><div class="muted">Entrada: ${safe(h.check_in_date)} ${safe(h.check_in_time||'')} · Salida: ${safe(h.check_out_date)} ${safe(h.check_out_time||'')}</div><div class="muted">${safe(h.maps_url)}</div><div class="muted">${safe(h.notes)}</div><div class="actions"><button class="btn alt editHotel" data-id="${h.id}">Editar</button><button class="btn red deleteHotel" data-id="${h.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Aún no hay alojamientos.</p>';el.querySelectorAll('.editHotel').forEach(b=>b.onclick=()=>openHotel(b.dataset.id));el.querySelectorAll('.deleteHotel').forEach(b=>b.onclick=()=>deleteHotel(b.dataset.id))}
function openActivity(date='2026-10-27',id=''){document.getElementById('activityForm').reset();document.getElementById('activityId').value=id;document.getElementById('oldPhoto').value='';activityModal.classList.add('open');if(id){const x=activities.find(a=>a.id===id);document.getElementById('activityModalTitle').textContent='Editar actividad';activityDate.value=x.activity_date;activityTime.value=x.time==='—'?'':x.time;activityTitle.value=x.title;activityDescription.value=x.description||'';activityMap.value=x.google_maps_url||'';activityPhoto.value=x.photo_url?.startsWith('http')?x.photo_url:'';document.getElementById('oldPhoto').value=x.photo_url||''}else{document.getElementById('activityModalTitle').textContent='Añadir actividad';activityDate.value=date}}
function openFlight(id=''){document.getElementById('flightForm').reset();document.getElementById('flightId').value=id;flightModal.classList.add('open');if(id){const f=flights.find(x=>x.id===id);document.getElementById('flightModalTitle').textContent='Editar vuelo';flightType.value=f.flight_type;flightAirline.value=f.airline||'';flightNumber.value=f.flight_number||'';flightFrom.value=f.origin||'';flightTo.value=f.destination||'';flightDate.value=f.flight_date||'';flightDeparture.value=f.departure_time||'';flightArrival.value=f.arrival_time||'';flightDetails.value=f.details||'';flightNotes.value=f.notes||''}else{document.getElementById('flightModalTitle').textContent='Añadir vuelo'}}
function openHotel(id=''){document.getElementById('hotelForm').reset();document.getElementById('hotelId').value=id;hotelModal.classList.add('open');if(id){const h=hotels.find(x=>x.id===id);document.getElementById('hotelModalTitle').textContent='Editar alojamiento';hotelName.value=h.name||'';hotelCity.value=h.city||'';hotelAddress.value=h.address||'';hotelMaps.value=h.maps_url||'';hotelCheckInDate.value=h.check_in_date||'';hotelCheckInTime.value=h.check_in_time||'';hotelCheckOutDate.value=h.check_out_date||'';hotelCheckOutTime.value=h.check_out_time||'';hotelNotes.value=h.notes||''}else{document.getElementById('hotelModalTitle').textContent='Añadir alojamiento'}}
document.getElementById('cancelActivity').onclick=()=>activityModal.classList.remove('open');document.getElementById('cancelFlight').onclick=()=>flightModal.classList.remove('open');document.getElementById('cancelHotel').onclick=()=>hotelModal.classList.remove('open');
document.getElementById('activityForm').onsubmit=async e=>{e.preventDefault();const file=activityFile.files[0];let photo=document.getElementById('oldPhoto').value;if(file){const path=tripId+'/'+currentUser.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await client.storage.from('japan-photos').upload(path,file);if(up.error){alert(up.error.message);return}photo=path}else if(activityPhoto.value)photo=activityPhoto.value;const v={trip_id:tripId,activity_date:activityDate.value,time:activityTime.value||'—',title:activityTitle.value,description:activityDescription.value,google_maps_url:activityMap.value,photo_url:photo,created_by:currentUser.id};const id=activityId.value;const r=id?await client.from('activities').update(v).eq('id',id):await client.from('activities').insert(v);if(r.error)alert(r.error.message);else{activityModal.classList.remove('open');loadData()}};
document.getElementById('flightForm').onsubmit=async e=>{e.preventDefault();const v={trip_id:tripId,flight_type:flightType.value,airline:flightAirline.value,flight_number:flightNumber.value,origin:flightFrom.value,destination:flightTo.value,flight_date:flightDate.value,departure_time:flightDeparture.value,arrival_time:flightArrival.value,details:flightDetails.value,notes:flightNotes.value};const id=flightId.value;const r=id?await client.from('trip_flights').update(v).eq('id',id):await client.from('trip_flights').insert(v);if(r.error)alert(r.error.message);else{flightModal.classList.remove('open');loadData()}};
document.getElementById('hotelForm').onsubmit=async e=>{e.preventDefault();const v={trip_id:tripId,name:hotelName.value,city:hotelCity.value,address:hotelAddress.value,maps_url:hotelMaps.value,check_in_date:hotelCheckInDate.value,check_in_time:hotelCheckInTime.value,check_out_date:hotelCheckOutDate.value,check_out_time:hotelCheckOutTime.value,notes:hotelNotes.value};const id=hotelId.value;const r=id?await client.from('trip_hotels').update(v).eq('id',id):await client.from('trip_hotels').insert(v);if(r.error)alert(r.error.message);else{hotelModal.classList.remove('open');loadData()}};
async function deleteActivity(id){if(confirm('¿Eliminar esta actividad?')){const r=await client.from('activities').delete().eq('id',id);if(r.error)alert(r.error.message);else loadData()}}async function deleteFlight(id){if(confirm('¿Eliminar este vuelo?')){const r=await client.from('trip_flights').delete().eq('id',id);if(r.error)alert(r.error.message);else loadData()}}async function deleteHotel(id){if(confirm('¿Eliminar este alojamiento?')){const r=await client.from('trip_hotels').delete().eq('id',id);if(r.error)alert(r.error.message);else loadData()}}async function logout(){await client.auth.signOut();currentUser=null;showLogin()}showLogin();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
