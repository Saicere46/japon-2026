<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b3a"><title>Japón 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--i:#182b3a;--m:#71808a;--b:#f7f4ee;--p:#fff;--r:#bd5b55;--l:#e6e1d8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px system-ui,sans-serif}.wrap{max-width:950px;margin:auto}.hero{min-height:220px;padding:25px 20px;display:flex;align-items:end;color:#fff;background:linear-gradient(0deg,#102331e8,#10233122),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:clamp(36px,9vw,58px) Georgia,serif}.hero p{margin:7px 0}.bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--l);padding:14px 20px;display:flex;justify-content:space-between;gap:8px}.content{padding:22px 20px 60px}.card,.day{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.day{padding:0;overflow:hidden}.head{padding:17px;background:#f0f3f0;display:flex;justify-content:space-between;gap:8px}.head h2,.card h2{font:24px Georgia,serif;margin:3px 0}.head small{color:var(--r);font-weight:700;text-transform:uppercase}.act{border-top:1px solid var(--l);padding:15px 18px;display:flex;gap:13px}.time{color:var(--r);font-weight:700;min-width:45px}.act h3{margin:0 0 4px}.muted{color:var(--m)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--i);color:#fff;cursor:pointer;text-decoration:none}.alt{background:#eee9df;color:var(--i)}.red{background:#f2d9d5;color:#8d3933}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:4;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:94vh;overflow:auto;padding:22px;border-radius:20px 20px 0 0}.sheet h2{font:25px Georgia,serif;margin:0 0 12px}label{display:block;font-weight:650;margin:11px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;font:inherit}textarea{min-height:85px}.login{max-width:420px;margin:60px auto;padding:25px;background:white;border-radius:18px;border:1px solid var(--l)}.login h1{font:30px Georgia,serif}.error{color:#9b352f;background:#f8e0dd;padding:10px;border-radius:8px;margin:10px 0}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}} </style></head><body><div id="root"></div><div class="modal" id="modal"><div class="sheet"><h2 id="mt">Añadir actividad</h2><form onsubmit="saveActivity(event)"><input type="hidden" id="editId"><label>Fecha</label><input id="date" type="date" required><label>Hora</label><input id="time" type="time"><label>Nombre</label><input id="title" required placeholder="Ej. Templo Sensō-ji"><label>Descripción</label><textarea id="description" placeholder="Notas, reserva, horarios..."></textarea><label>Enlace de Google Maps</label><input id="maps" type="url" placeholder="https://maps.google.com/..."><label>Fotografía (URL opcional)</label><input id="photo" type="url" placeholder="https://..."><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn">Guardar</button></div></form></div></div><script>
const URL='https://kbxyknwnueipkxcxxojc.supabase.co',KEY='sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q',sb=supabase.createClient(URL,KEY),TRIP='81d43e9a-8d00-4087-a512-b2bc02dd3a44';let user,acts=[],info;
const seed=[['2026-10-27','—','Vuelo Madrid → Osaka','Añadir aerolínea, número y horarios',''],['2026-10-28','—','Llegada a Kansai','Traslado al alojamiento y check-in',''],['2026-10-28','—','Dotonbori','Paseo nocturno y primera cena','https://www.google.com/maps/search/Dotonbori+Osaka'],['2026-10-29','10:00','Castillo de Osaka','Visita y paseo por el parque','https://www.google.com/maps/search/Osaka+Castle'],['2026-10-30','09:00','Fushimi Inari','Excursión a Kioto','https://www.google.com/maps/search/Fushimi+Inari'],['2026-10-30','14:00','Gion','Barrio tradicional de Kioto','https://www.google.com/maps/search/Gion+Kyoto'],['2026-11-01','09:00','Arashiyama','Bosque de bambú y alrededores','https://www.google.com/maps/search/Arashiyama'],['2026-11-02','—','Osaka → Takayama','Añadir tren, bus, horarios y reserva',''],['2026-11-03','—','Shirakawa-go','Aldea histórica y paisaje de montaña','https://www.google.com/maps/search/Shirakawa-go'],['2026-11-04','—','Takayama → Tokio','Añadir tren y alojamiento',''],['2026-11-09','—','Últimas compras','Pendiente de organizar',''],['2026-11-10','—','Vuelo Tokio → España','Añadir aeropuerto, vuelo y horario','']];
function login(){root.innerHTML='<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form onsubmit="doLogin(event)"><label>Correo electrónico</label><input id="email" type="email" required><label>Contraseña</label><input id="pass" type="password" required><div id="err"></div><button class="btn" style="margin-top:16px;width:100%">Entrar</button></form></div>'}async function doLogin(e){e.preventDefault();err.innerHTML='';let r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)err.innerHTML='<div class="error">'+r.error.message+'</div>';else{user=r.data.user;load()}}async function load(){let a=await sb.from('activities').select('*').eq('trip_id',TRIP).order('activity_date').order('time');acts=a.data||[];let q=await sb.from('trip_info').select('*').eq('trip_id',TRIP).single();info=q.data||{};if(!acts.length){for(let x of seed)await sb.from('activities').insert({trip_id:TRIP,activity_date:x[0],time:x[1],title:x[2],description:x[3],google_maps_url:x[4],created_by:user.id});let a2=await sb.from('activities').select('*').eq('trip_id',TRIP).order('activity_date');acts=a2.data||[]}render()}function dayTitle(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}function city(d){if(d<='2026-11-01')return d==='2026-10-30'||d==='2026-11-01'?'Kioto':'Osaka';if(d<='2026-11-03')return d==='2026-11-03'?'Shirakawa-go':'Takayama';if(d<'2026-11-10')return 'Tokio';return 'Regreso a España'}function render(){let groups={};acts.forEach(a=>(groups[a.activity_date]??=[]).push(a));root.innerHTML='<header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" onclick="logout()">Salir</button><button class="btn" onclick="openNew()">＋ Añadir</button></div></div><main class="content wrap"><div class="cards"><div class="card"><h2>✈ Vuelos</h2><div class="muted">${info.outbound_flight||''}</div><hr><div class="muted">${info.return_flight||''}</div><button class="btn alt" style="margin-top:10px" onclick="editInfo()">Editar información</button></div><div class="card"><h2>⌂ Hoteles</h2><div class="muted" style="white-space:pre-line">${info.hotels||'Pendiente de completar'}</div><button class="btn alt" style="margin-top:10px" onclick="editInfo()">Editar información</button></div></div><h2 style="font:26px Georgia,serif;margin:26px 0 14px">Itinerario</h2>${Object.keys(groups).sort().map(d=>'<section class="day"><div class="head"><div><small>'+dayTitle(d)+'</small><h2>'+city(d)+'</h2></div><button class="btn alt" onclick="openNew(\''+d+'\')">＋ Actividad</button></div>'+groups[d].map(a=>'<article class="act"> <div class="time">'+(a.time||'—')+'</div><div style="flex:1"><h3>'+esc(a.title)+'</h3><p class="muted">'+esc(a.description||'')+'</p><div class="actions">'+(a.google_maps_url?'<a class="btn alt" target="_blank" href="'+a.google_maps_url+'">↗ Google Maps</a>':'')+'<button class="btn alt" onclick="editAct(\''+a.id+'\')">Editar</button><button class="btn red" onclick="delAct(\''+a.id+'\')">Eliminar</button></div></div></article>').join('')+'</section>').join('')}</main>'}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openNew(d){document.querySelector('form').reset();editId.value='';date.value=d||'2026-10-27';mt.textContent='Añadir actividad';modal.classList.add('show')}function editAct(id){let a=acts.find(x=>x.id===id);editId.value=id;date.value=a.activity_date;time.value=a.time||'';title.value=a.title;description.value=a.description||'';maps.value=a.google_maps_url||'';photo.value=a.photo_url||'';mt.textContent='Editar actividad';modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}async function saveActivity(e){e.preventDefault();let v={trip_id:TRIP,activity_date:date.value,time:time.value||'—',title:title.value,description:description.value,google_maps_url:maps.value,photo_url:photo.value,created_by:user.id};let r=editId.value?await sb.from('activities').update(v).eq('id',editId.value):await sb.from('activities').insert(v);if(r.error)alert(r.error.message);else{closeModal();load()}}async function delAct(id){if(confirm('¿Eliminar esta actividad?')){let r=await sb.from('activities').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}function editInfo(){let x=prompt('Escribe la información de vuelos, hoteles y notas separada por |',[(info.outbound_flight||''),(info.return_flight||''),(info.hotels||''),(info.notes||'')].join('|'));if(x!==null){let v=x.split('|');sb.from('trip_info').update({outbound_flight:v[0]||'',return_flight:v[1]||'',hotels:v[2]||'',notes:v[3]||''}).eq('trip_id',TRIP).then(load)}}async function logout(){await sb.auth.signOut();login()}login();</script></body></html>
