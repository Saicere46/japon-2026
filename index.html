<style>
:root{--bg:#f7f4ee;--paper:#fff;--ink:#182b3a;--muted:#74818b;--line:#e6e1d8;--accent:#bd5b55;--accent2:#d9a74d;--shadow:0 14px 34px rgba(24,43,58,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f7f4ee 0%,#fbfaf7 100%);color:var(--ink);font:15px/1.45 system-ui,sans-serif;-webkit-text-size-adjust:100%}.wrap{max-width:1080px;margin:auto;padding:0 14px}.hero{padding:18px 0 18px;color:#fff;background:linear-gradient(0deg,rgba(8,21,31,.88),rgba(8,21,31,.18)),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1600&q=80') center/cover;box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}.hero h1{margin:0;font:clamp(32px,8vw,54px) Georgia,serif;line-height:1}.hero p{margin:8px 0 0;color:#f2eadf}.topbar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(230,225,216,.9)}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}.brand{font-weight:750;letter-spacing:.02em}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);min-height:44px;min-width:44px}.btn.alt{background:#f0e9dd;color:var(--ink)}.btn.red{background:#f2d9d5;color:#8d3933}.btn.small{padding:10px 12px;border-radius:12px;font-size:13px}.content{padding:18px 0 54px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card h2{margin:0 0 6px;font:22px Georgia,serif}.kpi{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}.sub{color:var(--muted);font-size:13px}.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.pill{padding:8px 10px;border-radius:999px;background:#f7f3eb;border:1px solid var(--line);font-size:13px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:18px 0 12px}.section-title h2{margin:0;font:24px Georgia,serif}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 14px 12px;background:linear-gradient(110deg,#f2f4f2,#fff);display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-head small{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.panel-head h2{margin:4px 0 0;font:22px Georgia,serif}.day{border-top:1px solid var(--line)}.day-body{padding:12px 14px 14px}.activity{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px dashed #ece7de}.activity:first-child{border-top:0}.time{min-width:48px;color:var(--accent);font-weight:800;font-size:13px}.activity h3{margin:0 0 4px;font-size:15px}.activity p{margin:4px 0;color:var(--muted)}.thumb{width:78px;height:62px;object-fit:cover;border-radius:11px;border:1px solid #eee}.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.muted{color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.item h3{margin:0 0 5px;font-size:15px}.item .meta{color:var(--muted);font-size:13px;line-height:1.4}.progress{height:10px;border-radius:999px;background:#eee3d1;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}.check{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid #f0ece4}.check:first-child{border-top:0}.check input{margin-top:4px;transform:scale(1.08)}.login{max-width:420px;margin:48px auto;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}label{display:block;font-weight:750;margin:10px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit;background:#fff}textarea{min-height:92px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:20;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:20px;box-shadow:var(--shadow)}.sheet h2{font:24px Georgia,serif;margin:0 0 10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.tabs button{border:0;background:#f0e9dd;color:var(--ink);border-radius:999px;padding:9px 12px;min-height:40px}.tabs button.active{background:var(--ink);color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px;color:var(--muted)}.hide-mobile{display:block} .mobile-only{display:none}@media (max-width:760px){.split,.row{grid-template-columns:1fr}.activity{grid-template-columns:auto 1fr}.thumb{display:none}.hero{padding-top:16px}.topbar-inner{flex-direction:column;align-items:flex-start}.actions{width:100%}.actions .btn{flex:1;text-align:center}.hide-mobile{display:none}.mobile-only{display:block}.grid{grid-template-columns:1fr}.card{padding:15px}.section-title{align-items:flex-start}.panel-head{flex-direction:column;align-items:flex-start}.panel-head .actions{width:100%}.panel-head .btn{flex:1;text-align:center}}
</style>

<body>
<div id="root"></div>

<div id="modalFlight" class="modal"><div class="sheet"><h2 id="flightTitle">Editar vuelo</h2><form id="flightForm"><input type="hidden" id="flightId"><div class="tabs"><button type="button" class="tab active" data-type="ida">Ida</button><button type="button" class="tab" data-type="vuelta">Vuelta</button><button type="button" class="tab" data-type="interna">Escala / interno</button></div><div class="row"><div><label>Aerolínea</label><input id="flightAirline" required></div><div><label>Número</label><input id="flightNumber"></div></div><div class="row"><div><label>Origen</label><input id="flightFrom"></div><div><label>Destino</label><input id="flightTo"></div></div><div class="row"><div><label>Fecha</label><input id="flightDate" type="date"></div><div><label>Terminal / escala</label><input id="flightDetails"></div></div><div class="row"><div><label>Salida</label><input id="flightDeparture" type="time"></div><div><label>Llegada</label><input id="flightArrival" type="time"></div></div><label>Notas</label><textarea id="flightNotes"></textarea><div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" id="cancelFlight">Cancelar</button><button class="btn">Guardar vuelo</button></div></form></div></div>
<div id="modalHotel" class="modal"><div class="sheet"><h2 id="hotelTitle">Editar alojamiento</h2><form id="hotelForm"><input type="hidden" id="hotelId"><label>Nombre del alojamiento</label><input id="hotelName" required><div class="row"><div><label>Ciudad</label><input id="hotelCity" required></div><div><label>Google Maps</label><input id="hotelMaps" type="url"></div></div><label>Dirección</label><input id="hotelAddress"><div class="row"><div><label>Entrada</label><input id="hotelCheckInDate" type="date"></div><div><label>Hora entrada</label><input id="hotelCheckInTime" type="time"></div></div><div class="row"><div><label>Salida</label><input id="hotelCheckOutDate" type="date"></div><div><label>Hora salida</label><input id="hotelCheckOutTime" type="time"></div></div><label>Notas</label><textarea id="hotelNotes"></textarea><div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" id="cancelHotel">Cancelar</button><button class="btn">Guardar alojamiento</button></div></form></div></div>
<div id="modalActivity" class="modal"><div class="sheet"><h2 id="activityTitle">Añadir actividad</h2><form id="activityForm"><input type="hidden" id="activityId"><input type="hidden" id="activityOldPhoto"><div class="row"><div><label>Fecha</label><input id="activityDate" type="date" required></div><div><label>Hora</label><input id="activityTime" type="time"></div></div><label>Nombre</label><input id="activityName" required><div class="row"><div><label>Categoría</label><select id="activityCategory"><option>Visita</option><option>Comida</option><option>Transporte</option><option>Reserva</option><option>Compras</option><option>Otro</option></select></div><div><label>Estado</label><select id="activityStatus"><option>Pendiente</option><option>Reservado</option><option>Completado</option></select></div></div><div class="row"><div><label>Coste</label><input id="activityCost" placeholder="Ej. 25 €"></div><div><label>Maps</label><input id="activityMaps" type="url"></div></div><label>Notas</label><textarea id="activityNotes"></textarea><label>Foto</label><input id="activityFile" type="file" accept="image/*"><input id="activityUrl" type="url" placeholder="o pega una URL"><div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" id="cancelActivity">Cancelar</button><button class="btn">Guardar actividad</button></div></form></div></div>
<div id="modalBudget" class="modal"><div class="sheet"><h2>Presupuesto</h2><form id="budgetForm"><div class="row"><div><label>Total</label><input id="budgetTotal"></div><div><label>Imprevistos</label><input id="budgetEmergency"></div></div><div class="row"><div><label>Vuelos</label><input id="budgetFlights"></div><div><label>Alojamientos</label><input id="budgetHotels"></div></div><div class="row"><div><label>Comidas</label><input id="budgetFood"></div><div><label>Transportes</label><input id="budgetTransport"></div></div><div class="row"><div><label>Actividades</label><input id="budgetActivities"></div><div><label>Compras</label><input id="budgetShopping"></div></div><label>Notas</label><textarea id="budgetNotes"></textarea><div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" id="cancelBudget">Cancelar</button><button class="btn">Guardar presupuesto</button></div></form></div></div>
<div id="modalChecklist" class="modal"><div class="sheet"><h2>Checklist</h2><form id="checklistForm"><div id="checklistList"></div><label>Nuevo elemento</label><input id="checklistNew" placeholder="Ej. Adaptador japonés"><div class="actions"><button type="button" class="btn alt" id="addChecklistItem">Añadir elemento</button></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" id="cancelChecklist">Cancelar</button><button class="btn">Guardar checklist</button></div></form></div></div>
<script>
const projectUrl='https://kbxyknwnueipkxcxxojc.supabase.co',publishableKey='sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q',client=window.supabase.createClient(projectUrl,publishableKey),tripId='81d43e9a-8d00-4087-a512-b2bc02dd3a44';const root=document.getElementById('root');let currentUser=null,activities=[],flights=[],hotels=[],budget={},checklist=[],tripInfo={},channel=null;
function showLogin(){root.innerHTML=`<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form id="loginForm"><label>Correo electrónico</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div id="loginError"></div><button class="btn" style="margin-top:15px;width:100%">Entrar</button></form></div>`;loginForm.onsubmit=login}
async function login(e){e.preventDefault();const err=document.getElementById('loginError');const r=await client.auth.signInWithPassword({email:loginEmail.value,password:loginPassword.value});if(r.error){err.innerHTML=`<div class="error">${r.error.message}</div>`;return}currentUser=r.data.user;await loadData()}
async function loadData(){const [a,f,h,b,c,i]=await Promise.all([client.from('activities').select('*').eq('trip_id',tripId).order('activity_date').order('time'),client.from('trip_flights').select('*').eq('trip_id',tripId).order('flight_date'),client.from('trip_hotels').select('*').eq('trip_id',tripId).order('check_in_date'),client.from('trip_budget').select('*').eq('trip_id',tripId).single(),client.from('trip_checklist').select('*').eq('trip_id',tripId).order('sort_order'),client.from('trip_info').select('*').eq('trip_id',tripId).single()]);activities=a.data||[];flights=f.data||[];hotels=h.data||[];budget=b.data||{};checklist=c.data||[];tripInfo=i.data||{};for(const x of activities){x.photoUrl=x.photo_url||'';if(x.photo_url&&!x.photo_url.startsWith('http')){const s=await client.storage.from('japan-photos').createSignedUrl(x.photo_url,3600);x.photoUrl=s.data?.signedUrl||''}}render();startRealtime()}
function startRealtime(){if(channel)client.removeChannel(channel);channel=client.channel('japan-live').on('postgres_changes',{event:'*',schema:'public',table:'activities',filter:`trip_id=eq.${tripId}`},loadData).on('postgres_changes',{event:'*',schema:'public',table:'trip_flights',filter:`trip_id=eq.${tripId}`},loadData).on('postgres_changes',{event:'*',schema:'public',table:'trip_hotels',filter:`trip_id=eq.${tripId}`},loadData).on('postgres_changes',{event:'*',schema:'public',table:'trip_budget',filter:`trip_id=eq.${tripId}`},loadData).on('postgres_changes',{event:'*',schema:'public',table:'trip_checklist',filter:`trip_id=eq.${tripId}`},loadData).subscribe()}
function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function city(d){if(d<='2026-11-01')return d==='2026-10-30'||d==='2026-11-01'?'Kioto':'Osaka';if(d<='2026-11-03')return d==='2026-11-03'?'Shirakawa-go':'Takayama';return d<'2026-11-10'?'Tokio':'Regreso a España'}
function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function percent(){return checklist.length?Math.round(checklist.filter(x=>x.done).length/checklist.length*100):0}
function render(){const byDay={};activities.forEach(a=>(byDay[a.activity_date]??=[]).push(a));const days=Object.keys(byDay).sort();root.innerHTML=`<header class="hero"><div class="wrap"><div class="hero-inner"><h1>Japón 2026</h1><p>Madrid · Shanghái · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></div></header><div class="topbar"><div class="wrap topbar-inner"><div class="brand">✦ Nuestro viaje</div><div class="actions"><button class="btn alt small" id="openBudget">Presupuesto</button><button class="btn alt small" id="openChecklist">Checklist</button><button class="btn small" id="logout">Salir</button></div></div></div><main class="content"><div class="wrap"><div class="grid"><div class="card"><h2>Resumen</h2><div class="kpi">${safe(budget.total||'—')} <span class="sub">presupuesto total</span></div><div class="mini"><div class="pill">Vuelos: ${safe(budget.flights||'—')}</div><div class="pill">Hoteles: ${safe(budget.hotels||'—')}</div><div class="pill">Comidas: ${safe(budget.food||'—')}</div><div class="pill">Transporte: ${safe(budget.transport||'—')}</div></div></div><div class="card"><h2>Checklist</h2><div class="kpi">${percent()}% <span class="sub">completado</span></div><div class="progress"><div style="width:${percent()}%"></div></div><div class="sub" style="margin-top:10px">${checklist.filter(x=>x.done).length} de ${checklist.length} tareas</div></div><div class="card"><h2>Vuelos</h2><div class="sub">${flights.length} vuelos guardados</div><button class="btn alt small" id="openFlightModal">＋ Editar vuelos</button></div><div class="card"><h2>Alojamientos</h2><div class="sub">${hotels.length} alojamientos guardados</div><button class="btn alt small" id="openHotelModal">＋ Editar alojamientos</button></div></div><div class="section-title"><div><h2>Itinerario</h2><div class="sub">Todo optimizado para móvil, con botones grandes y lectura rápida</div></div><button class="btn alt small" id="openActivityModal">＋ Actividad</button></div><div class="panel">${days.map(d=>`<div class="day"><div class="panel-head"><div><small>${dayName(d)}</small><h2>${city(d)}</h2></div><button class="btn alt small addDay" data-date="${d}">＋ Actividad</button></div><div class="day-body">${byDay[d].map(x=>`<div class="activity">${x.photoUrl?`<img class="thumb" loading="lazy" src="${x.photoUrl}">`:''}<div class="time">${safe(x.time||'—')}</div><div><h3>${safe(x.title)}</h3><p>${safe(x.description||'')}</p><div class="tiny">${safe(x.category||'')} ${x.status?`· ${safe(x.status)}`:''} ${x.cost?`· ${safe(x.cost)}`:''}</div><div class="row-actions">${x.google_maps_url?`<a class="btn alt small" target="_blank" href="${x.google_maps_url}">Google Maps</a>`:''}<button class="btn alt small editActivity" data-id="${x.id}">Editar</button><button class="btn red small deleteActivity" data-id="${x.id}">Eliminar</button></div></div></div>`).join('')}</div></div>`).join('')}</div></main>`;document.getElementById('logout').onclick=logout;document.getElementById('openBudget').onclick=()=>openBudget();document.getElementById('openChecklist').onclick=()=>openChecklist();document.getElementById('openFlightModal').onclick=()=>openFlight();document.getElementById('openHotelModal').onclick=()=>openHotel();document.getElementById('openActivityModal').onclick=()=>openActivity();document.querySelectorAll('.addDay').forEach(b=>b.onclick=()=>openActivity(b.dataset.date));document.querySelectorAll('.editActivity').forEach(b=>b.onclick=()=>openActivity(null,b.dataset.id));document.querySelectorAll('.deleteActivity').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.id));renderFlights();renderHotels();renderChecklistSummary()}
function renderFlights(){const card=document.querySelectorAll('.card')[2];card.innerHTML=`<h2>Vuelos</h2><div class="sub">${flights.length} vuelos guardados</div><div class="list">${flights.map(f=>`<div class="item"><h3>${safe(f.flight_type)} · ${safe(f.airline)} ${safe(f.flight_number)}</h3><div class="meta">${safe(f.origin)} → ${safe(f.destination)} · ${safe(f.flight_date||'')} ${safe(f.departure_time||'')} ${f.arrival_time?`→ ${safe(f.arrival_time)}`:''}</div><div class="meta">${safe(f.details||'')}</div><div class="meta">${safe(f.notes||'')}</div><div class="actions"><button class="btn alt small editFlight" data-id="${f.id}">Editar</button><button class="btn red small deleteFlight" data-id="${f.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Aún no hay vuelos.</p>'}</div><button class="btn alt small" id="openFlightModal2">＋ Editar vuelos</button>`;document.getElementById('openFlightModal2').onclick=()=>openFlight();card.querySelectorAll('.editFlight').forEach(b=>b.onclick=()=>openFlight(b.dataset.id));card.querySelectorAll('.deleteFlight').forEach(b=>b.onclick=()=>deleteFlight(b.dataset.id))}
function renderHotels(){const card=document.querySelectorAll('.card')[3];card.innerHTML=`<h2>Alojamientos</h2><div class="sub">${hotels.length} alojamientos guardados</div><div class="list">${hotels.map(h=>`<div class="item"><h3>${safe(h.name)} · ${safe(h.city)}</h3><div class="meta">${safe(h.address||'')}</div><div class="meta">Entrada: ${safe(h.check_in_date||'')} ${safe(h.check_in_time||'')} · Salida: ${safe(h.check_out_date||'')} ${safe(h.check_out_time||'')}</div><div class="meta">${safe(h.maps_url||'')}</div><div class="meta">${safe(h.notes||'')}</div><div class="actions"><button class="btn alt small editHotel" data-id="${h.id}">Editar</button><button class="btn red small deleteHotel" data-id="${h.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Aún no hay alojamientos.</p>'}</div><button class="btn alt small" id="openHotelModal2">＋ Editar alojamientos</button>`;document.getElementById('openHotelModal2').onclick=()=>openHotel();card.querySelectorAll('.editHotel').forEach(b=>b.onclick=()=>openHotel(b.dataset.id));card.querySelectorAll('.deleteHotel').forEach(b=>b.onclick=()=>deleteHotel(b.dataset.id))}
function renderChecklistSummary(){const card=document.querySelectorAll('.card')[1];card.innerHTML=`<h2>Checklist</h2><div class="kpi">${percent()}% <span class="sub">completado</span></div><div class="progress"><div style="width:${percent()}%"></div></div><div class="sub" style="margin-top:10px">${checklist.filter(x=>x.done).length} de ${checklist.length} tareas</div>`}
function openFlight(id=''){flightForm.reset();flightId.value=id;modalFlight.classList.add('open');if(id){const f=flights.find(x=>x.id===id);flightTitle.textContent='Editar vuelo';flightType.value=f.flight_type||'ida';flightAirline.value=f.airline||'';flightNumber.value=f.flight_number||'';flightFrom.value=f.origin||'';flightTo.value=f.destination||'';flightDate.value=f.flight_date||'';flightDeparture.value=f.departure_time||'';flightArrival.value=f.arrival_time||'';flightDetails.value=f.details||'';flightNotes.value=f.notes||''}else{flightTitle.textContent='Añadir vuelo';flightType.value='ida'}}
function openHotel(id=''){hotelForm.reset();hotelId.value=id;modalHotel.classList.add('open');if(id){const h=hotels.find(x=>x.id===id);hotelTitle.textContent='Editar alojamiento';hotelName.value=h.name||'';hotelCity.value=h.city||'';hotelAddress.value=h.address||'';hotelMaps.value=h.maps_url||'';hotelCheckInDate.value=h.check_in_date||'';hotelCheckInTime.value=h.check_in_time||'';hotelCheckOutDate.value=h.check_out_date||'';hotelCheckOutTime.value=h.check_out_time||'';hotelNotes.value=h.notes||''}else{hotelTitle.textContent='Añadir alojamiento'}}
function openActivity(date='2026-10-27',id=''){activityForm.reset();activityId.value=id;activityOldPhoto.value='';modalActivity.classList.add('open');if(id){const x=activities.find(a=>a.id===id);activityTitle.textContent='Editar actividad';activityDate.value=x.activity_date;activityTime.value=x.time==='—'?'':x.time;activityName.value=x.title;activityCategory.value=x.category||'Visita';activityStatus.value=x.status||'Pendiente';activityCost.value=x.cost||'';activityMaps.value=x.google_maps_url||'';activityNotes.value=x.description||'';activityUrl.value=x.photo_url?.startsWith('http')?x.photo_url:'';activityOldPhoto.value=x.photo_url||''}else{activityTitle.textContent='Añadir actividad';activityDate.value=date;activityCategory.value='Visita';activityStatus.value='Pendiente'}}
function openBudget(){modalBudget.classList.add('open');budgetTotal.value=budget.total||'';budgetEmergency.value=budget.emergency||'';budgetFlights.value=budget.flights||'';budgetHotels.value=budget.hotels||'';budgetFood.value=budget.food||'';budgetTransport.value=budget.transport||'';budgetActivities.value=budget.activities||'';budgetShopping.value=budget.shopping||'';budgetNotes.value=budget.notes||''}
function openChecklist(){modalChecklist.classList.add('open');renderChecklistEditor()}
function renderChecklistEditor(){checklistList.innerHTML=checklist.map((x)=>`<div class="check"><input type="checkbox" data-id="${x.id}" ${x.done?'checked':''}><div style="flex:1"><input data-title="${x.id}" value="${safe(x.title)}" style="margin-bottom:8px"><input data-notes="${x.id}" value="${safe(x.notes||'')}" placeholder="Notas opcionales"></div><button type="button" class="btn red small delCheck" data-id="${x.id}">Eliminar</button></div>`).join('')||'<p class="muted">Aún no hay elementos.</p>';checklistList.querySelectorAll('.delCheck').forEach(b=>b.onclick=()=>removeChecklistItem(b.dataset.id))}
async function removeChecklistItem(id){await client.from('trip_checklist').delete().eq('id',id);loadData()}
addChecklistItem.onclick=async()=>{const t=checklistNew.value.trim();if(!t)return;await client.from('trip_checklist').insert({trip_id:tripId,title:t,done:false,notes:'',sort_order:checklist.length});checklistNew.value='';loadData()}
const close=m=>m.classList.remove('open');cancelFlight.onclick=()=>close(modalFlight);cancelHotel.onclick=()=>close(modalHotel);cancelActivity.onclick=()=>close(modalActivity);cancelBudget.onclick=()=>close(modalBudget);cancelChecklist.onclick=()=>close(modalChecklist);
flightForm.onsubmit=async e=>{e.preventDefault();const v={trip_id:tripId,flight_type:flightType.value,airline:flightAirline.value,flight_number:flightNumber.value,origin:flightFrom.value,destination:flightTo.value,flight_date:flightDate.value,departure_time:flightDeparture.value,arrival_time:flightArrival.value,details:flightDetails.value,notes:flightNotes.value};const id=flightId.value;const r=id?await client.from('trip_flights').update(v).eq('id',id):await client.from('trip_flights').insert(v);if(r.error)return alert(r.error.message);modalFlight.classList.remove('open');loadData()}
hotelForm.onsubmit=async e=>{e.preventDefault();const v={trip_id:tripId,name:hotelName.value,city:hotelCity.value,address:hotelAddress.value,maps_url:hotelMaps.value,check_in_date:hotelCheckInDate.value,check_in_time:hotelCheckInTime.value,check_out_date:hotelCheckOutDate.value,check_out_time:hotelCheckOutTime.value,notes:hotelNotes.value};const id=hotelId.value;const r=id?await client.from('trip_hotels').update(v).eq('id',id):await client.from('trip_hotels').insert(v);if(r.error)return alert(r.error.message);modalHotel.classList.remove('open');loadData()}
activityForm.onsubmit=async e=>{e.preventDefault();let photo=activityOldPhoto.value;const file=activityFile.files[0];if(file){const path=tripId+'/'+currentUser.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await client.storage.from('japan-photos').upload(path,file);if(up.error)return alert(up.error.message);photo=path}else if(activityUrl.value)photo=activityUrl.value;const v={trip_id:tripId,activity_date:activityDate.value,time:activityTime.value||'—',title:activityName.value,category:activityCategory.value,status:activityStatus.value,cost:activityCost.value,description:activityNotes.value,google_maps_url:activityMaps.value,photo_url:photo,created_by:currentUser.id};const id=activityId.value;const r=id?await client.from('activities').update(v).eq('id',id):await client.from('activities').insert(v);if(r.error)return alert(r.error.message);modalActivity.classList.remove('open');loadData()}
budgetForm.onsubmit=async e=>{e.preventDefault();const v={trip_id:tripId,total:budgetTotal.value,emergency:budgetEmergency.value,flights:budgetFlights.value,hotels:budgetHotels.value,food:budgetFood.value,transport:budgetTransport.value,activities:budgetActivities.value,shopping:budgetShopping.value,notes:budgetNotes.value};const r=await client.from('trip_budget').upsert(v);if(r.error)return alert(r.error.message);modalBudget.classList.remove('open');loadData()}
checklistForm.onsubmit=async e=>{e.preventDefault();for(let i=0;i<checklistList.children.length;i++){const row=checklistList.children[i],id=row.querySelector('[data-id]')?.dataset.id,title=row.querySelector('[data-title]')?.value||'',notes=row.querySelector('[data-notes]')?.value||'',done=row.querySelector('input[type=checkbox]')?.checked||false;if(id)await client.from('trip_checklist').update({title,notes,done,sort_order:i}).eq('id',id)}modalChecklist.classList.remove('open');loadData()}
window.toggleChecklist=async(id,done)=>{await client.from('trip_checklist').update({done}).eq('id',id);loadData()}
async function deleteFlight(id){if(confirm('¿Eliminar este vuelo?')){await client.from('trip_flights').delete().eq('id',id);loadData()}}async function deleteHotel(id){if(confirm('¿Eliminar este alojamiento?')){await client.from('trip_hotels').delete().eq('id',id);loadData()}}async function deleteActivity(id){if(confirm('¿Eliminar esta actividad?')){await client.from('activities').delete().eq('id',id);loadData()}}async function logout(){await client.auth.signOut();currentUser=null;showLogin()}
showLogin();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
