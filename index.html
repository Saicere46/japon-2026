<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182b3a">
<link rel="manifest" href="manifest.json">
<title>Japón 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f7f4ee;color:#182b3a;font:15px system-ui,sans-serif}.wrap{max-width:930px;margin:auto}.hero{padding:55px 20px 30px;color:#fff;background:linear-gradient(#0003,#102331e8),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:52px Georgia,serif}.bar{padding:14px 20px;background:#fff;display:flex;justify-content:space-between;position:sticky;top:0;z-index:2}.content{padding:20px}.card,.day,.login{background:#fff;border:1px solid #e6e1d8;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.day{padding:0;overflow:hidden}.head{padding:16px;background:#eef1ee;display:flex;justify-content:space-between;gap:8px}.head h2,.card h2{margin:4px 0;font:25px Georgia,serif}.head small{color:#bd5b55;font-weight:bold}.act{padding:15px 18px;border-top:1px solid #e6e1d8;display:flex;gap:15px}.time{color:#bd5b55;font-weight:bold;min-width:45px}.act h3{margin:0}.muted{color:#71808a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#182b3a;color:#fff;cursor:pointer;text-decoration:none}.alt{background:#eee9df;color:#182b3a}.red{background:#f2d9d5;color:#8d3933}.photo{width:100px;height:75px;object-fit:cover;border-radius:10px}input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;font:inherit}label{display:block;font-weight:bold;margin:10px 0 5px}.login{max-width:400px;margin:60px auto}.error{color:#9b352f;background:#f8e0dd;padding:10px;border-radius:8px;margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{background:#fff;padding:22px;border-radius:18px;width:min(650px,90%);max-height:92vh;overflow:auto}.sheet h2{font:26px Georgia,serif;margin-top:0}
</style>
</head>
<body>
<div id="root"></div>
<div id="activityModal" class="modal"><div class="sheet"><h2 id="activityModalTitle">Añadir actividad</h2><form id="activityForm"><input type="hidden" id="activityId"><input type="hidden" id="oldPhoto"><label>Fecha</label><input id="activityDate" type="date" required><label>Hora</label><input id="activityTime" type="time"><label>Nombre</label><input id="activityTitle" required><label>Descripción y notas</label><textarea id="activityDescription"></textarea><label>Enlace de Google Maps</label><input id="activityMap" type="url"><label>Fotografía desde el móvil</label><input id="activityFile" type="file" accept="image/*"><label>URL de fotografía opcional</label><input id="activityPhoto" type="url"><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelActivity">Cancelar</button><button class="btn">Guardar actividad</button></div></form></div></div>
<div id="infoModal" class="modal"><div class="sheet"><h2>Vuelos y alojamientos</h2><form id="infoForm"><h3>Vuelo de ida</h3><label>Aerolínea y número</label><input id="outAir"><label>Ruta y terminales</label><input id="outRoute"><label>Fecha y horarios</label><input id="outTimes" placeholder="27/10/2026 · salida · llegada"><label>Localizador o enlace</label><input id="outBooking"><h3>Vuelo de vuelta</h3><label>Aerolínea y número</label><input id="backAir"><label>Ruta y terminales</label><input id="backRoute"><label>Fecha y horarios</label><input id="backTimes" placeholder="10/11/2026 · salida · llegada"><label>Localizador o enlace</label><input id="backBooking"><h3>Alojamientos</h3><label>Osaka</label><textarea id="hotelOsaka"></textarea><label>Takayama</label><textarea id="hotelTakayama"></textarea><label>Tokio</label><textarea id="hotelTokyo"></textarea><label>Notas generales</label><textarea id="generalNotes"></textarea><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelInfo">Cancelar</button><button class="btn">Guardar información</button></div></form></div></div>
<script>
const projectUrl="https://kbxyknwnueipkxcxxojc.supabase.co";
const publishableKey="sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q";
const client=window.supabase.createClient(projectUrl,publishableKey);
const tripId="81d43e9a-8d00-4087-a512-b2bc02dd3a44";
const root=document.getElementById("root"),activityModal=document.getElementById("activityModal"),infoModal=document.getElementById("infoModal");
let currentUser=null,activities=[],tripInfo={},channel=null;
function showLogin(){root.innerHTML='<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form id="loginForm"><label>Correo electrónico</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div id="loginError"></div><button class="btn" style="margin-top:15px;width:100%">Entrar</button></form></div>';document.getElementById("loginForm").onsubmit=login}
async function login(e){e.preventDefault();const error=document.getElementById("loginError");const r=await client.auth.signInWithPassword({email:document.getElementById("loginEmail").value,password:document.getElementById("loginPassword").value});if(r.error){error.innerHTML='<div class="error">'+r.error.message+'</div>';return}currentUser=r.data.user;await loadData()}
async function loadData(){const a=await client.from("activities").select("*").eq("trip_id",tripId).order("activity_date").order("time");const i=await client.from("trip_info").select("*").eq("trip_id",tripId).single();activities=a.data||[];tripInfo=i.data||{};for(const item of activities){item.photoUrl=item.photo_url||"";if(item.photo_url&&!item.photo_url.startsWith("http")){const s=await client.storage.from("japan-photos").createSignedUrl(item.photo_url,3600);item.photoUrl=s.data?.signedUrl||""}}render();startRealtime()}
function startRealtime(){if(channel)client.removeChannel(channel);channel=client.channel("japan-2026-live").on("postgres_changes",{event:"*",schema:"public",table:"activities",filter:"trip_id=eq."+tripId},loadData).on("postgres_changes",{event:"*",schema:"public",table:"trip_info",filter:"trip_id=eq."+tripId},loadData).subscribe()}
function safe(v){return String(v||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayName(d){return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
function city(d){if(d<="2026-11-01")return d==="2026-10-30"||d==="2026-11-01"?"Kioto":"Osaka";if(d<="2026-11-03")return d==="2026-11-03"?"Shirakawa-go":"Takayama";return d<"2026-11-10"?"Tokio":"Regreso a España"}
function render(){const groups={};activities.forEach(x=>{(groups[x.activity_date]??=[]).push(x)});const days=Object.keys(groups).sort();let html='<header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" id="logout">Salir</button><button class="btn" id="addTop">＋ Añadir</button></div></div><main class="content wrap"><div class="grid"><div class="card"><h2>✈ Vuelos</h2><p class="muted">'+safe(tripInfo.outbound_flight)+'</p><hr><p class="muted">'+safe(tripInfo.return_flight)+'</p><button class="btn alt" id="editInfo">Editar vuelos y hoteles</button></div><div class="card"><h2>⌂ Alojamientos</h2><p class="muted" style="white-space:pre-line">'+safe(tripInfo.hotels||"Pendiente de completar")+'</p><button class="btn alt" id="editInfo2">Editar vuelos y hoteles</button></div></div><h2 style="font:26px Georgia,serif">Itinerario</h2>';for(const d of days){html+='<section class="day"><div class="head"><div><small>'+dayName(d)+'</small><h2>'+city(d)+'</h2></div><button class="btn alt addDay" data-date="'+d+'">＋ Actividad</button></div>';for(const x of groups[d]){html+='<article class="act">'+(x.photoUrl?'<img class="photo" src="'+x.photoUrl+'">':'')+'<div class="time">'+safe(x.time||"—")+'</div><div style="flex:1"><h3>'+safe(x.title)+'</h3><p class="muted">'+safe(x.description)+'</p><div class="actions">'+(x.google_maps_url?'<a class="btn alt" target="_blank" href="'+x.google_maps_url+'">↗ Google Maps</a>':'')+'<button class="btn alt edit" data-id="'+x.id+'">Editar</button><button class="btn red delete" data-id="'+x.id+'">Eliminar</button></div></div></article>'}html+='</section>'}html+='</main>';root.innerHTML=html;document.getElementById("logout").onclick=logout;document.getElementById("addTop").onclick=()=>openActivity();document.getElementById("editInfo").onclick=openInfo;document.getElementById("editInfo2").onclick=openInfo;document.querySelectorAll(".addDay").forEach(b=>b.onclick=()=>openActivity(b.dataset.date));document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>openActivity(null,b.dataset.id));document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>deleteActivity(b.dataset.id))}
function openActivity(date="2026-10-27",id=""){document.getElementById("activityForm").reset();document.getElementById("activityId").value=id;document.getElementById("oldPhoto").value="";activityModal.classList.add("open");if(id){const x=activities.find(a=>a.id===id);document.getElementById("activityModalTitle").textContent="Editar actividad";document.getElementById("activityDate").value=x.activity_date;document.getElementById("activityTime").value=x.time==="—"?"":x.time;document.getElementById("activityTitle").value=x.title;document.getElementById("activityDescription").value=x.description||"";document.getElementById("activityMap").value=x.google_maps_url||"";document.getElementById("activityPhoto").value=x.photo_url?.startsWith("http")?x.photo_url:"";document.getElementById("oldPhoto").value=x.photo_url||""}else{document.getElementById("activityModalTitle").textContent="Añadir actividad";document.getElementById("activityDate").value=date}}
document.getElementById("cancelActivity").onclick=()=>activityModal.classList.remove("open");document.getElementById("activityForm").onsubmit=async e=>{e.preventDefault();const file=document.getElementById("activityFile").files[0];let photo=document.getElementById("oldPhoto").value;if(file){const path=tripId+"/"+currentUser.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await client.storage.from("japan-photos").upload(path,file);if(up.error){alert(up.error.message);return}photo=path}else if(document.getElementById("activityPhoto").value)photo=document.getElementById("activityPhoto").value;const v={trip_id:tripId,activity_date:document.getElementById("activityDate").value,time:document.getElementById("activityTime").value||"—",title:document.getElementById("activityTitle").value,description:document.getElementById("activityDescription").value,google_maps_url:document.getElementById("activityMap").value,photo_url:photo,created_by:currentUser.id};const id=document.getElementById("activityId").value;const r=id?await client.from("activities").update(v).eq("id",id):await client.from("activities").insert(v);if(r.error)alert(r.error.message);else{activityModal.classList.remove("open");loadData()}};
function openInfo(){const f=document.getElementById;document.getElementById("outAir").value=tripInfo.outbound_flight||"";document.getElementById("backAir").value=tripInfo.return_flight||"";document.getElementById("hotelOsaka").value=tripInfo.hotels||"";document.getElementById("generalNotes").value=tripInfo.notes||"";infoModal.classList.add("open")}
document.getElementById("cancelInfo").onclick=()=>infoModal.classList.remove("open");document.getElementById("infoForm").onsubmit=async e=>{e.preventDefault();const byId=id=>document.getElementById(id).value.trim();const out=[byId("outAir"),byId("outRoute"),byId("outTimes"),byId("outBooking")].filter(Boolean).join(" · ");const back=[byId("backAir"),byId("backRoute"),byId("backTimes"),byId("backBooking")].filter(Boolean).join(" · ");const hotels="Osaka: "+byId("hotelOsaka")+"\nTakayama: "+byId("hotelTakayama")+"\nTokio: "+byId("hotelTokyo");const r=await client.from("trip_info").update({outbound_flight:out,return_flight:back,hotels,notes:byId("generalNotes")}).eq("trip_id",tripId);if(r.error)alert(r.error.message);else{infoModal.classList.remove("open");loadData()}};
async function deleteActivity(id){if(confirm("¿Eliminar esta actividad?")){const r=await client.from("activities").delete().eq("id",id);if(r.error)alert(r.error.message);else loadData()}}async function logout(){await client.auth.signOut();currentUser=null;showLogin()}showLogin();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
