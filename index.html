<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b3a"><title>Japón 2026</title><style>:root{--ink:#182b3a;--muted:#71808a;--bg:#f7f4ee;--paper:#fff;--red:#bd5b55;--line:#e6e1d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.hero{min-height:250px;padding:28px 20px;display:flex;align-items:end;color:#fff;background:linear-gradient(0deg,#102331e8,#10233122),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:clamp(34px,9vw,58px) Georgia,serif}.hero p{margin:8px 0}.wrap{max-width:960px;margin:auto}.bar{position:sticky;top:0;z-index:3;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:12px 20px;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:20px;color:var(--muted)}.nav button.active{background:var(--ink);color:#fff}.content{padding:22px 20px 60px}.card,.day{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.card h2,.day h2{font:25px Georgia,serif;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:var(--muted)}.notice{padding:13px;border-radius:12px;background:#fff7d9;border:1px solid #eddda5;color:#725b20;margin-bottom:18px}.day{padding:0;overflow:hidden}.dayhead{padding:18px;background:linear-gradient(110deg,#eef1ee,#fff);display:flex;justify-content:space-between;gap:10px}.dayhead small{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.07em}.activity{padding:16px 18px;border-top:1px solid var(--line);display:flex;gap:14px}.time{min-width:48px;color:var(--red);font-weight:700}.activity h3{margin:0 0 4px}.activity p{margin:5px 0;color:var(--muted);line-height:1.45}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{padding:9px 12px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none}.btn.alt{background:#eee9df;color:var(--ink)}.btn.red{background:#f2d9d5;color:#8d3933}.pill{display:inline-block;background:#f0e8d7;color:#765d25;border-radius:20px;padding:5px 9px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:94vh;overflow:auto;padding:22px;border-radius:20px 20px 0 0}.sheet h2{font:25px Georgia,serif;margin:0 0 12px}label{display:block;font-weight:650;margin:11px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}textarea{min-height:80px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}} </style></head><body><header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" onclick="exportData()">Exportar</button><button class="btn" onclick="newActivity()">＋ Añadir</button></div></div><nav class="nav" id="nav"></nav><main class="content wrap" id="app"></main><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Editar</h2><form onsubmit="saveForm(event)"><input type="hidden" id="mode"><input type="hidden" id="oldDate"><input type="hidden" id="oldIndex"><div id="dayField"><label>Día</label><select id="date"></select></div><label>Hora</label><input id="time" type="time"><label>Nombre / título</label><input id="name" required><label>Descripción, datos o notas</label><textarea id="desc"></textarea><label>Enlace de Google Maps</label><input id="map" type="url" placeholder="https://maps.google.com/..."><label>Fotografía (URL opcional)</label><input id="photo" type="url" placeholder="https://..."><label>Subir foto desde este móvil (opcional)</label><input id="file" type="file" accept="image/*" onchange="readPhoto(event)"><div class="form-actions"><button type="button" class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn">Guardar cambios</button></div></form></div></div><script>
const seed=[['2026-10-27','Salida de Madrid','Vuelo a Japón',[['—','Vuelo Madrid → Osaka','Añadir aerolínea, número de vuelo y horarios','']]],['2026-10-28','Llegada a Osaka','Primera noche en Japón',[['—','Llegada a Kansai','Añadir terminal, traslado y alojamiento',''],['—','Dotonbori','Paseo nocturno y primera cena','https://www.google.com/maps/search/Dotonbori+Osaka']]],['2026-10-29','Osaka','Osaka',[['10:00','Castillo de Osaka','Visita y paseo por el parque','https://www.google.com/maps/search/Osaka+Castle']]],['2026-10-30','Kioto','Excursión desde Osaka',[['09:00','Fushimi Inari','Miles de torii y paseo por la montaña','https://www.google.com/maps/search/Fushimi+Inari'],['14:00','Gion','Barrio tradicional de Kioto','https://www.google.com/maps/search/Gion+Kyoto']]],['2026-10-31','Osaka','Día flexible',[['—','Día por decidir','Añadid aquí vuestras ideas','']]],['2026-11-01','Kioto','Segunda excursión',[['09:00','Arashiyama','Bosque de bambú y alrededores','https://www.google.com/maps/search/Arashiyama'],['—','Cena en Kioto','Pendiente de reservar','']]],['2026-11-02','Takayama','Cambio de ciudad',[['—','Osaka → Takayama','Añadir tren, bus, horarios y reserva','']]],['2026-11-03','Shirakawa-go','Excursión desde Takayama',[['—','Shirakawa-go','Aldea histórica y paisaje de montaña','https://www.google.com/maps/search/Shirakawa-go']]],['2026-11-04','Tokio','Takayama → Tokio',[['—','Traslado a Tokio','Añadir tren y alojamiento','']]],...['2026-11-05','2026-11-06','2026-11-07','2026-11-08'].map(d=>[d,'Tokio','Tokio', [['—','Día por decidir','Añadid aquí vuestras ideas','']]]),['2026-11-09','Tokio','Último día',[['—','Últimas compras','Pendiente de organizar','']]],['2026-11-10','Regreso a España','Fin del viaje',[['—','Vuelo Tokio → España','Añadir aeropuerto, vuelo y horario','']]]];
let data=JSON.parse(localStorage.japan2026v2||'null')||seed.map(x=>({date:x[0],title:x[1],subtitle:x[2],items:x[3].map(a=>({time:a[0],name:a[1],desc:a[2],map:a[3],photo:''}))}));let trip=JSON.parse(localStorage.japanTrip||'null')||{flightOut:'Madrid → Osaka · 27/10/2026 · pendiente de completar',flightBack:'Tokio → España · 10/11/2026 · pendiente de completar',hotels:'Añadir hoteles, direcciones y localizadores',notes:'Seguro, eSIM, reservas y documentación'};let photoData='';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});function persist(){localStorage.japan2026v2=JSON.stringify(data);localStorage.japanTrip=JSON.stringify(trip)}function render(){nav.innerHTML='<button class="active" onclick="all(this)">Todo</button>'+[...new Set(data.map(x=>x.title))].map(t=>`<button onclick="filterCity('${t}',this)">${t}</button>`).join('');app.innerHTML=`<div class="notice">Fase 2: ahora podéis editar días, vuelos, hoteles y actividades desde el móvil. Los cambios se guardan en este navegador.</div><section class="cards"><div class="card"><h2>✈ Vuelos</h2><div class="muted">${trip.flightOut}</div><hr><div class="muted">${trip.flightBack}</div><button class="btn alt" style="margin-top:12px" onclick="editTrip()">Editar vuelos</button></div><div class="card"><h2>⌂ Alojamientos</h2><div class="muted">${trip.hotels}</div><button class="btn alt" style="margin-top:12px" onclick="editTrip()">Editar hoteles</button></div><div class="card"><h2>✎ Notas</h2><div class="muted">${trip.notes}</div><button class="btn alt" style="margin-top:12px" onclick="editTrip()">Editar notas</button></div></section><div style="display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px"><h2 style="font:25px Georgia,serif;margin:0">Itinerario</h2><span class="muted">27 oct — 10 nov</span></div>`+data.map((d,di)=>`<section class="day" id="d${d.date}" data-city="${d.title}"><div class="dayhead"><div><small>${fmt(d.date)}</small><h2>${d.title}</h2><div class="muted">${d.subtitle}</div></div><button class="btn alt" onclick="editDay(${di})">Editar día</button></div>${d.items.map((a,i)=>`<article class="activity">${a.photo?`<img src="${a.photo}" style="width:70px;height:70px;object-fit:cover;border-radius:10px">`:''}<div class="time">${a.time}</div><div style="flex:1"><h3>${a.name}</h3><p>${a.desc||''}</p><div class="actions">${a.map?`<a class="btn alt" href="${a.map}" target="_blank">↗ Google Maps</a>`:''}<button class="btn alt" onclick="editActivity(${di},${i})">Editar</button><button class="btn red" onclick="removeActivity(${di},${i})">Eliminar</button></div></div></article>`).join('')}</section>`).join('')}
function all(b){document.querySelectorAll('.day').forEach(x=>x.style.display='');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function filterCity(c,b){document.querySelectorAll('.day').forEach(x=>x.style.display=x.dataset.city==c?'':'none');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function fillDays(){date.innerHTML=data.map(d=>`<option value="${d.date}">${fmt(d.date)} · ${d.title}</option>`).join('')}function openForm(mode,di=-1,ii=-1){modeEl=mode;document.getElementById('mode').value=mode;fillDays();if(mode==='activity'){modalTitle.textContent=ii<0?'Añadir actividad':'Editar actividad';dayField.style.display='block';if(di>=0){date.value=data[di].date;let a=data[di].items[ii];time.value=a.time==='—'?'':a.time;name.value=a.name;desc.value=a.desc;map.value=a.map;photo.value=a.photo;oldDate.value=di;oldIndex.value=ii}}else{modalTitle.textContent='Editar información del viaje';dayField.style.display='none';name.value='Información general';desc.value=`Vuelos de ida: ${trip.flightOut}\n\nVuelos de vuelta: ${trip.flightBack}\n\nHoteles: ${trip.hotels}\n\nNotas: ${trip.notes}`;time.value='';map.value='';photo.value=''}modal.classList.add('show')}function newActivity(){document.querySelector('form').reset();openForm('activity')}function editActivity(di,ii){document.querySelector('form').reset();openForm('activity',di,ii)}function editDay(di){let d=data[di];document.querySelector('form').reset();openForm('activity',di,0);name.value=d.title;desc.value=d.subtitle;time.value='';document.getElementById('oldIndex').value='day'}function editTrip(){document.querySelector('form').reset();openForm('trip')}function readPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>photoData=r.result;r.readAsDataURL(f)}function closeModal(){modal.classList.remove('show')}function saveForm(e){e.preventDefault();if(modeEl==='trip'){let lines=desc.value.split('\n').filter(x=>x.trim());trip.flightOut=lines[0]||'';trip.flightBack=lines[1]||'';trip.hotels=lines[2]||'';trip.notes=lines.slice(3).join(' ')||'';persist();closeModal();render();return}let di=data.findIndex(d=>d.date===date.value);let ii=+oldIndex.value;if(oldIndex.value==='day'){data[di].title=name.value;data[di].subtitle=desc.value}else{let a={time:time.value||'—',name:name.value,desc:desc.value,map:map.value,photo:photoData||photo.value};if(ii>=0)data[di].items[ii]=a;else data[di].items.push(a);data[di].items.sort((a,b)=>a.time.localeCompare(b.time))}photoData='';persist();closeModal();render()}function removeActivity(di,ii){if(confirm('¿Eliminar esta actividad?')){data[di].items.splice(ii,1);persist();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({trip,data},null,2)],{type:'application/json'}));a.download='japon-2026-itinerario.json';a.click()}render();</script></body></html>
