<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japón 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f4ee;color:#182b3a;font:15px system-ui}.hero{padding:55px 20px 30px;color:white;background:linear-gradient(#0003,#102331e8),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:52px Georgia,serif}.wrap{max-width:900px;margin:auto}.bar{padding:14px 20px;background:white;display:flex;justify-content:space-between;position:sticky;top:0}.content{padding:20px}.card,.day,.login{background:white;border:1px solid #e6e1d8;border-radius:16px;padding:18px;margin:14px 0}.day{padding:0;overflow:hidden}.head{padding:16px;background:#eef1ee;display:flex;justify-content:space-between}.head h2{margin:4px 0;font:25px Georgia,serif}.head small{color:#bd5b55;font-weight:bold}.act{padding:15px 18px;border-top:1px solid #e6e1d8;display:flex;gap:15px}.time{color:#bd5b55;font-weight:bold;min-width:45px}.act h3{margin:0}.muted{color:#71808a}.btn{border:0;border-radius:9px;padding:9px 12px;background:#182b3a;color:white;cursor:pointer;text-decoration:none}.alt{background:#eee9df;color:#182b3a}.red{background:#f2d9d5;color:#8d3933}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;font:inherit}label{display:block;font-weight:bold;margin:10px 0 5px}.login{max-width:400px;margin:60px auto}.error{color:#9b352f;background:#f8e0dd;padding:10px;border-radius:8px;margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal.open{display:flex}.sheet{background:white;padding:22px;border-radius:18px;width:min(600px,90%);max-height:90vh;overflow:auto}</style></head><body><div id="root"></div><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">Actividad</h2><form id="activityForm"><input type="hidden" id="activityId"><label>Fecha</label><input id="activityDate" type="date" required><label>Hora</label><input id="activityTime" type="time"><label>Nombre</label><input id="activityTitle" required><label>Descripción</label><textarea id="activityDescription"></textarea><label>Enlace de Google Maps</label><input id="activityMap" type="url"><label>Foto mediante URL</label><input id="activityPhoto" type="url"><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancel">Cancelar</button><button class="btn">Guardar</button></div></form></div></div><script>
const projectUrl = 'https://kbxyknwnueipkxcxxojc.supabase.co';
const publishableKey = 'sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q';
const db = supabase.createClient(projectUrl, publishableKey);
const tripId = '81d43e9a-8d00-4087-a512-b2bc02dd3a44';
let currentUser = null;
let activities = [];
let tripInfo = {};

function showLogin() {
  root.innerHTML = `<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form id="loginForm"><label>Correo electrónico</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div id="loginError"></div><button class="btn" style="margin-top:15px;width:100%">Entrar</button></form></div>`;
  document.getElementById('loginForm').addEventListener('submit', login);
}

async function login(event) {
  event.preventDefault();
  loginError.innerHTML = '';
  const result = await db.auth.signInWithPassword({email: loginEmail.value, password: loginPassword.value});
  if (result.error) loginError.innerHTML = `<div class="error">${result.error.message}</div>`;
  else { currentUser = result.data.user; await loadData(); }
}

async function loadData() {
  const a = await db.from('activities').select('*').eq('trip_id', tripId).order('activity_date').order('time');
  const i = await db.from('trip_info').select('*').eq('trip_id', tripId).single();
  activities = a.data || [];
  tripInfo = i.data || {};
  render();
}

function dayName(value) { return new Date(value + 'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}); }
function city(value) { if (value <= '2026-11-01') return value === '2026-10-30' || value === '2026-11-01' ? 'Kioto' : 'Osaka'; if (value <= '2026-11-03') return value === '2026-11-03' ? 'Shirakawa-go' : 'Takayama'; return value < '2026-11-10' ? 'Tokio' : 'Regreso a España'; }
function safe(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const groups = {};
  activities.forEach(item => { if (!groups[item.activity_date]) groups[item.activity_date] = []; groups[item.activity_date].push(item); });
  const days = Object.keys(groups).sort();
  root.innerHTML = `<header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" id="logout">Salir</button><button class="btn" id="addTop">＋ Añadir</button></div></div><main class="content wrap"><div class="grid"><div class="card"><h2>✈ Vuelos</h2><p class="muted">${safe(tripInfo.outbound_flight)}</p><hr><p class="muted">${safe(tripInfo.return_flight)}</p><button class="btn alt" id="editInfo">Editar información</button></div><div class="card"><h2>⌂ Hoteles</h2><p class="muted" style="white-space:pre-line">${safe(tripInfo.hotels || 'Pendiente de completar')}</p><button class="btn alt" id="editInfo2">Editar información</button></div></div><h2 style="font:26px Georgia,serif">Itinerario</h2>${days.map(day => `<section class="day"><div class="head"><div><small>${dayName(day)}</small><h2>${city(day)}</h2></div><button class="btn alt addDay" data-date="${day}">＋ Actividad</button></div>${groups[day].map(item => `<article class="act"><div class="time">${safe(item.time || '—')}</div><div style="flex:1"><h3>${safe(item.title)}</h3><p class="muted">${safe(item.description)}</p><div class="actions">${item.google_maps_url ? `<a class="btn alt" target="_blank" href="${item.google_maps_url}">↗ Google Maps</a>` : ''}<button class="btn alt edit" data-id="${item.id}">Editar</button><button class="btn red delete" data-id="${item.id}">Eliminar</button></div></div></article>`).join('')}</section>`).join('')}</main>`;
  document.getElementById('logout').onclick = logout;
  document.getElementById('addTop').onclick = () => openActivity();
  document.getElementById('editInfo').onclick = editInfo;
  document.getElementById('editInfo2').onclick = editInfo;
  document.querySelectorAll('.addDay').forEach(b => b.onclick = () => openActivity(b.dataset.date));
  document.querySelectorAll('.edit').forEach(b => b.onclick = () => openActivity(null,b.dataset.id));
  document.querySelectorAll('.delete').forEach(b => b.onclick = () => deleteActivity(b.dataset.id));
}

function openActivity(date = '2026-10-27', id = '') {
  activityForm.reset(); activityId.value = id; modal.classList.add('open');
  if (id) { const item = activities.find(x => x.id === id); modalTitle.textContent = 'Editar actividad'; activityDate.value = item.activity_date; activityTime.value = item.time === '—' ? '' : item.time; activityTitle.value = item.title; activityDescription.value = item.description || ''; activityMap.value = item.google_maps_url || ''; activityPhoto.value = item.photo_url || ''; }
  else { modalTitle.textContent = 'Añadir actividad'; activityDate.value = date; }
}

cancel.onclick = () => modal.classList.remove('open');
activityForm.onsubmit = async event => { event.preventDefault(); const values = {trip_id:tripId,activity_date:activityDate.value,time:activityTime.value || '—',title:activityTitle.value,description:activityDescription.value,google_maps_url:activityMap.value,photo_url:activityPhoto.value,created_by:currentUser.id}; const result = activityId.value ? await db.from('activities').update(values).eq('id',activityId.value) : await db.from('activities').insert(values); if (result.error) alert(result.error.message); else { modal.classList.remove('open'); await loadData(); } };
async function deleteActivity(id) { if (confirm('¿Eliminar esta actividad?')) { const result = await db.from('activities').delete().eq('id',id); if (result.error) alert(result.error.message); else loadData(); } }
async function editInfo() { const text = prompt('Escribe: vuelo de ida | vuelo de vuelta | hoteles | notas', [tripInfo.outbound_flight || '',tripInfo.return_flight || '',tripInfo.hotels || '',tripInfo.notes || ''].join(' | ')); if (text !== null) { const x = text.split('|'); const result = await db.from('trip_info').update({outbound_flight:(x[0]||'').trim(),return_flight:(x[1]||'').trim(),hotels:(x[2]||'').trim(),notes:(x[3]||'').trim()}).eq('trip_id',tripId); if (result.error) alert(result.error.message); else loadData(); } }
async function logout() { await db.auth.signOut(); currentUser = null; showLogin(); }
showLogin();
</script></body></html>
