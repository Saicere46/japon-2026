<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b3a"><link rel="manifest" href="manifest.json"><title>Japón 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f4ee;color:#182b3a;font:15px system-ui}.hero{padding:55px 20px 30px;color:#fff;background:linear-gradient(#0003,#102331e8),url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=80') center/cover}.hero h1{margin:0;font:52px Georgia,serif}.wrap{max-width:930px;margin:auto}.bar{padding:14px 20px;background:#fff;display:flex;justify-content:space-between;position:sticky;top:0;z-index:2}.content{padding:20px}.card,.day,.login{background:#fff;border:1px solid #e6e1d8;border-radius:16px;padding:18px;margin:14px 0}.day{padding:0;overflow:hidden}.head{padding:16px;background:#eef1ee;display:flex;justify-content:space-between}.head h2,.card h2{margin:4px 0;font:25px Georgia,serif}.head small{color:#bd5b55;font-weight:bold}.act{padding:15px 18px;border-top:1px solid #e6e1d8;display:flex;gap:15px}.time{color:#bd5b55;font-weight:bold;min-width:45px}.act h3{margin:0}.muted{color:#71808a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#182b3a;color:#fff;cursor:pointer;text-decoration:none}.alt{background:#eee9df;color:#182b3a}.red{background:#f2d9d5;color:#8d3933}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.photo{width:100px;height:75px;object-fit:cover;border-radius:10px}input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;font:inherit}label{display:block;font-weight:bold;margin:10px 0 5px}.login{max-width:400px;margin:60px auto}.error{color:#9b352f;background:#f8e0dd;padding:10px;border-radius:8px;margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{background:#fff;padding:22px;border-radius:18px;width:min(650px,90%);max-height:92vh;overflow:auto}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button.active{background:#182b3a;color:white}</style></head><body><div id="root"></div><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">Actividad</h2><form id="activityForm"><input type="hidden" id="activityId"><input type="hidden" id="oldPhoto"><label>Fecha</label><input id="activityDate" type="date" required><label>Hora</label><input id="activityTime" type="time"><label>Nombre</label><input id="activityTitle" required><label>Categoría</label><select id="activityCategory"><option>Visita</option><option>Comida</option><option>Transporte</option><option>Compras</option><option>Reserva</option><option>Otro</option></select><label>Estado</label><select id="activityStatus"><option>Pendiente</option><option>Reservado</option><option>Completado</option></select><label>Coste</label><input id="activityCost" placeholder="Ej. 25 €"><label>Descripción y notas</label><textarea id="activityDescription"></textarea><label>Enlace de Google Maps</label><input id="activityMap" type="url"><label>Fotografía</label><input id="activityFile" type="file" accept="image/*"><input id="activityPhoto" type="url" placeholder="o pega una URL"><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancel">Cancelar</button><button class="btn">Guardar actividad</button></div></form></div></div><div id="infoModal" class="modal"><div class="sheet"><h2>Vuelos y alojamientos</h2><form id="infoForm"><h3>Vuelo de ida</h3><label>Aerolínea y número</label><input id="outAir"><label>Salida · aeropuerto y terminal</label><input id="outFrom"><label>Llegada · aeropuerto y terminal</label><input id="outTo"><label>Fecha y horarios</label><input id="outTimes" placeholder="27/10/2026 · salida  · llegada "><label>Localizador y enlace</label><input id="outBooking"><h3>Vuelo de vuelta</h3><label>Aerolínea y número</label><input id="backAir"><label>Salida y llegada</label><input id="backRoute"><label>Fecha y horarios</label><input id="backTimes" placeholder="10/11/2026 · salida · llegada"><label>Localizador y enlace</label><input id="backBooking"><h3>Alojamientos</h3><label>Osaka</label><textarea id="hotelOsaka" placeholder="Nombre, dirección, fechas, localizador..."></textarea><label>Takayama</label><textarea id="hotelTakayama"></textarea><label>Tokio</label><textarea id="hotelTokyo"></textarea><label>Notas generales</label><textarea id="generalNotes"></textarea><div class="actions" style="justify-content:flex-end"><button type="button" class="btn alt" id="cancelInfo">Cancelar</button><button class="btn">Guardar información</button></div></form></div></div><script>
const projectUrl='https://kbxyknwnueipkxcxxojc.supabase.co',publishableKey='sb_publishable_eazng-Y7ZBrLOyWtFc6kcg_prD33d7q',db=supabase.createClient(projectUrl,publishableKey),tripId='81d43e9a-8d00-4087-a512-b2bc02dd3a44';let currentUser=null,activities=[],tripInfo={},realtimeChannel=null;
function showLogin(){root.innerHTML='<div class="login"><h1>Japón 2026</h1><p class="muted">Inicia sesión para editar el viaje.</p><form id="loginForm"><label>Correo electrónico</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div id="loginError"></div><button class="btn" style="margin-top:15px;width:100%">Entrar</button></form></div>';loginForm.onsubmit=login}async function login(e){e.preventDefault();loginError.innerHTML='';let r=await db.auth.signInWithPassword({email:loginEmail.value,password:loginPassword.value});if(r.error)loginError.innerHTML='<div class="error">'+r.error.message+'</div>';else{currentUser=r.data.user;loadData()}}async function loadData(){let a=await db.from('activities').select('*').eq('trip_id',tripId).order('activity_date').order('time'),i=await db.from('trip_info').select('*').eq('trip_id',tripId).single();activities=a.data||[];tripInfo=i.data||{};for(const x of activities){x.photoUrl=x.photo_url||'';if(x.photo_url&&!x.photo_url.startsWith('http')){let s=await db.storage.from('japan-photos').createSignedUrl(x.photo_url,3600);x.photoUrl=s.data?.signedUrl||''}}render();startRealtime()}function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}function city(d){if(d<='2026-11-01')return d==='2026-10-30'||d==='2026-11-01'?'Kioto':'Osaka';if(d<='2026-11-03')return d==='2026-11-03'?'Shirakawa-go':'Takayama';return d<'2026-11-10'?'Tokio':'Regreso a España'}function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let groups={};activities.forEach(x=>(groups[x.activity_date]??=[]).push(x));let days=Object.keys(groups).sort();root.innerHTML='<header class="hero"><div class="wrap"><h1>Japón 2026</h1><p>Madrid · Osaka · Kioto · Takayama · Shirakawa-go · Tokio</p></div></header><div class="bar"><strong>✦ Nuestro viaje</strong><div class="actions"><button class="btn alt" id="logout">Salir</button><button class="btn" id="addTop">＋ Añadir</button></div></div><main class="content wrap"><div class="grid"><div class="card"><h2>✈ Vuelos</h2><p class="muted">'+safe(tripInfo.outbound_flight)+'</p><hr><p class="muted">'+safe(tripInfo.return_flight)+'</p><button class="btn alt" id="editInfo">Editar vuelos y hoteles</button></div><div class="card"><h2>⌂ Alojamientos</h2><p class="muted" style="white-space:pre-line">'+safe(tripInfo.hotels||'Pendiente de completar')+'</p><button class="btn alt" id="editInfo2">Editar vuelos y hoteles</button></div></div><h2 style="font:26px Georgia,serif">Itinerario</h2>'+days.map(d=>'<section class="day"><div class="head"><div><small>'+dayName(d)+'</small><h2>'+city(d)+'</h2></div><button class="btn alt addDay" data-date="'+d+'">＋ Actividad</button></div>'+groups[d].map(x=>'<article class="act">'+(x.photoUrl?'<img class="photo" src="'+x.photoUrl+'">':'')+'<div class="time">'+safe(x.time||'—')+'</div><div style="flex:1"><h3>'+safe(x.title)+'</h3><p class="muted">'+safe(x.description)+'</p><div class="actions">'+(x.google_maps_url?'<a class="btn alt" target="_blank" href="'+x.google_maps_url+'">↗ Google Maps</a>':'')+'<button class="btn alt edit" data-id="'+x.id+'">Editar</button><button class="btn red delete" data-id="'+x.id+'">Eliminar</button></div></div></article>').join('')+'</section>').join('')+'</main>';logout.onclick=logoutUser;addTop.onclick=()=>openActivity();editInfo.onclick=openInfo;editInfo2.onclick=openInfo;document.querySelectorAll('.addDay').forEach(b=>b.onclick=()=>openActivity(b.dataset.date));document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openActivity(null,b.dataset.id));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.id))}function startRealtime(){if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('japan-2026-live').on('postgres_changes',{event:'*',schema:'public',table:'activities',filter:'trip_id=eq.'+tripId},()=>loadData()).on('postgres_changes',{event:'*',schema:'public',table:'trip_info',filter:'trip_id=eq.'+tripId},()=>loadData()).subscribe()}function openActivity(date='2026-10-27',id=''){activityForm.reset();activityId.value=id;oldPhoto.value='';modal.classList.add('open');if(id){let x=activities.find(a=>a.id===id);modalTitle.textContent='Editar actividad';activityDate.value=x.activity_date;activityTime.value=x.time==='—'?'':x.time;activityTitle.value=x.title;activityDescription.value=x.description||'';activityMap.value=x.google_maps_url||'';activityPhoto.value=x.photo_url?.startsWith('http')?x.photo_url:'';oldPhoto.value=x.photo_url||''}else{modalTitle.textContent='Añadir actividad';activityDate.value=date}}cancel.onclick=()=>modal.classList.remove('open');activityForm.onsubmit=async e=>{e.preventDefault();let photoPath=oldPhoto.value,file=activityFile.files[0];if(file){let path=tripId+'/'+currentUser.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await db.storage.from('japan-photos').upload(path,file);if(up.error){alert(up.error.message);return}photoPath=path}else if(activityPhoto.value)photoPath=activityPhoto.value;let v={trip_id:tripId,activity_date:activityDate.value,time:activityTime.value||'—',title:activityTitle.value,description:activityDescription.value,google_maps_url:activityMap.value,photo_url:photoPath,created_by:currentUser.id};let r=activityId.value?await db.from('activities').update(v).eq('id',activityId.value):await db.from('activities').insert(v);if(r.error)alert(r.error.message);else{modal.classList.remove('open');loadData()}}async function deleteActivity(id){if(confirm('¿Eliminar esta actividad?')){let r=await db.from('activities').delete().eq('id',id);if(r.error)alert(r.error.message);else loadData()}}function openInfo(){outAir.value=tripInfo.outbound_flight||'';backAir.value=tripInfo.return_flight||'';hotelOsaka.value=tripInfo.hotels||'';generalNotes.value=tripInfo.notes||'';infoModal.classList.add('open')}cancelInfo.onclick=()=>infoModal.classList.remove('open');infoForm.onsubmit=async e=>{e.preventDefault();let out=[outAir.value,outFrom.value,outTo.value,outTimes.value,outBooking.value].filter(Boolean).join(' · '),back=[backAir.value,backRoute.value,backTimes.value,backBooking.value].filter(Boolean).join(' · '),hotels='Osaka: '+hotelOsaka.value+'\nTakayama: '+hotelTakayama.value+'\nTokio: '+hotelTokyo.value;let r=await db.from('trip_info').update({outbound_flight:out,return_flight:back,hotels,notes:generalNotes.value}).eq('trip_id',tripId);if(r.error)alert(r.error.message);else{infoModal.classList.remove('open');loadData()}}async function logoutUser(){await db.auth.signOut();showLogin()}showLogin();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
